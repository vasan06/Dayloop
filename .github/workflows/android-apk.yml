name: Android Internal APK

on:
  workflow_dispatch:
  push:
    branches: [main, build-12]
    paths:
      - 'frontend/**'
      - 'mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_API_URL: ${{ vars.DAYLOOP_API_URL }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Install web dependencies
        run: npm ci
      - name: Validate Android API address
        run: |
          if [[ ! "$VITE_API_URL" =~ ^https://[[:alnum:].-]+(:[[:digit:]]+)?/api/v1/?$ ]]; then
            echo "::error::Set DAYLOOP_API_URL to the public HTTPS Render API URL ending in /api/v1."
            exit 1
          fi
          if [ "$VITE_FIREBASE_PROJECT_ID" != "dayloop-a5c00" ]; then
            echo "::error::Set VITE_FIREBASE_PROJECT_ID to dayloop-a5c00; the backend FIREBASE_PROJECT_ID must match."
            exit 1
          fi
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions variable $name."
              exit 1
            fi
          done
      - name: Build existing React frontend
        run: npm run build
      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm ci
      - name: Ensure Android project exists
        working-directory: mobile
        run: if [ ! -f android/gradlew ]; then npx cap add android; fi
      - name: Configure native Firebase Android authentication
        env:
          FIREBASE_ANDROID_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_JSON_BASE64 }}
          DAYLOOP_ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.DAYLOOP_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          # Prefer the secured workflow secret when supplied; otherwise use the
          # Firebase client configuration checked into the Android app folder.
          # google-services.json contains public client configuration, not a service account.
          if [ -n "$FIREBASE_ANDROID_JSON_BASE64" ]; then
            printf '%s' "$FIREBASE_ANDROID_JSON_BASE64" | base64 -d > mobile/android/app/google-services.json
          elif [ ! -f mobile/android/app/google-services.json ]; then
            echo "::error::Missing mobile/android/app/google-services.json and FIREBASE_ANDROID_JSON_BASE64 secret."
            exit 1
          fi
          python3 -c 'import json; p=json.load(open("mobile/android/app/google-services.json")); assert p.get("project_info",{}).get("project_id")=="dayloop-a5c00", "Unexpected Firebase project"; assert any(c.get("client_info",{}).get("android_client_info",{}).get("package_name")=="com.dayloop.app" for c in p.get("client",[])), "Firebase Android package must be com.dayloop.app"'
          python3 -c 'import json; p=json.load(open("mobile/android/app/google-services.json")); clients=[o for c in p.get("client",[]) if c.get("client_info",{}).get("android_client_info",{}).get("package_name")=="com.dayloop.app" for o in c.get("oauth_client",[])]; assert any(o.get("client_type")==1 for o in clients), "Register the Android signing SHA-1 in Firebase and refresh google-services.json"; assert any(o.get("client_type")==3 for o in clients), "Add a Web OAuth client for native token exchange"'
          if [ -z "$DAYLOOP_ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Missing DAYLOOP_ANDROID_DEBUG_KEYSTORE_BASE64 secret. Configure a stable Android debug signing keystore and register its SHA-1 with Firebase."
            exit 1
          fi
          signing_store="$(mktemp "$RUNNER_TEMP/dayloop-signing.XXXXXX")"
          printf '%s' "$DAYLOOP_ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > "$signing_store"
          chmod 600 "$signing_store"
          signing_sha1="$(keytool -list -v -keystore "$signing_store" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [ -z "$signing_sha1" ]; then
            echo "::error::Could not read the Android debug signing certificate from DAYLOOP_ANDROID_DEBUG_KEYSTORE_BASE64."
            exit 1
          fi
          firebase_sha1="$(python3 -c 'import json; p=json.load(open("mobile/android/app/google-services.json")); print(" ".join(o["android_info"]["certificate_hash"].upper() for c in p["client"] if c["client_info"].get("android_client_info",{}).get("package_name")=="com.dayloop.app" for o in c.get("oauth_client",[]) if o.get("client_type")==1))')"
          if [[ " $firebase_sha1 " != *" $signing_sha1 "* ]]; then
            echo "::error::Debug signing SHA-1 $signing_sha1 is not registered in the supplied Firebase Android configuration. Register this fingerprint in Firebase and download a refreshed google-services.json."
            exit 1
          fi
          # The Android OAuth client registered for this app currently uses
          # this fingerprint. Reject a self-consistent but unrelated secret pair.
          expected_sha1="0224D4E83EFFE3203DAB61F71894B3FBC7F71554"
          if [ "$signing_sha1" != "$expected_sha1" ]; then
            echo "::error::APK signer does not match DayLoop's registered Android SHA-1. Review the signing keystore secret before distributing this APK."
            exit 1
          fi
          signing_sha256="$(keytool -list -v -keystore "$signing_store" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          {
            echo "DAYLOOP_ANDROID_SIGNING_STORE_FILE=$signing_store"
            echo "ANDROID_SIGNING_SHA1=$signing_sha1"
          } >> "$GITHUB_ENV"
          echo "::notice::APK signer SHA-1: $signing_sha1 (matches Firebase Android OAuth client)"
          echo "::notice::APK signer SHA-256: $signing_sha256 (register in Firebase Android app settings if missing)"
          echo "::notice::APK package: com.dayloop.app; Firebase project: dayloop-a5c00"
      - name: Sync web assets to Android
        working-directory: mobile
        run: npx cap sync android
      - name: Compile internal APK
        working-directory: mobile/android
        run: ./gradlew assembleInternal --no-daemon
      - name: Verify APK identity, version, and signer
        run: |
          apk=mobile/android/app/build/outputs/apk/internal/app-internal.apk
          test "$(apkanalyzer manifest application-id "$apk")" = com.dayloop.app
          test "$(apkanalyzer manifest version-code "$apk")" = 12
          test "$(apkanalyzer manifest debuggable "$apk")" = false
          signer="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-1 digest:/ { print toupper($2) }')"
          test "$signer" = "$ANDROID_SIGNING_SHA1"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dayloop-android-debug-apk
          path: mobile/android/app/build/outputs/apk/internal/app-internal.apk
          if-no-files-found: error
          retention-days: 14
