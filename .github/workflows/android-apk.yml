name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_API_URL: ${{ vars.DAYLOOP_API_URL }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install web dependencies
        run: npm ci
      - name: Validate Android API address
        run: |
          if [[ ! "$VITE_API_URL" =~ ^https?://[^/]+/api/v1/?$ ]]; then
            echo "::error::Set GitHub Actions variable DAYLOOP_API_URL to the LAN/hosted FastAPI address, e.g. http://YOUR-PC-IP:8000/api/v1"
            exit 1
          fi
      - name: Build existing React frontend
        run: npm run build
      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm ci
      - name: Ensure Android project exists
        working-directory: mobile
        run: if [ ! -f android/gradlew ]; then npx cap add android; fi
      - name: Configure native Firebase Android authentication
        env:
          FIREBASE_ANDROID_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_JSON_BASE64 }}
          DAYLOOP_ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.DAYLOOP_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$FIREBASE_ANDROID_JSON_BASE64" ]; then
            echo "::error::Missing FIREBASE_ANDROID_JSON_BASE64 secret. Download google-services.json from your Firebase Android app (com.dayloop.app), then store its base64 contents as this secret."
            exit 1
          fi
          mkdir -p mobile/android/app
          printf '%s' "$FIREBASE_ANDROID_JSON_BASE64" | base64 -d > mobile/android/app/google-services.json
          python3 -c 'import json; p=json.load(open("mobile/android/app/google-services.json")); assert any(c.get("client_info",{}).get("android_client_info",{}).get("package_name")=="com.dayloop.app" for c in p.get("client",[])), "Firebase Android package must be com.dayloop.app"'
          if [ -z "$DAYLOOP_ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Missing DAYLOOP_ANDROID_DEBUG_KEYSTORE_BASE64 secret. Configure a stable Android debug signing keystore and register its SHA-1 with Firebase."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DAYLOOP_ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Sync web assets to Android
        working-directory: mobile
        run: npx cap sync android
      - name: Compile debug APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dayloop-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
